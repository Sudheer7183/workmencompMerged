<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /*
   * WeasyPrint PDF base styles.
   *
   * IMPORTANT: All colour values are explicit hex — never CSS custom properties.
   * WeasyPrint renders HTML server-side with no DOM and no runtime JS,
   * so CSS variables would resolve to empty strings.
   * Colours are injected via Jinja2 context (primary_colour, secondary_colour).
   *
   * PDF is always light-mode regardless of the user's theme preference.
   */

  @page {
    margin: 20mm 15mm;
    @bottom-right {
      content: "Page " counter(page) " of " counter(pages);
      font-size: 9pt;
      color: #566573;
    }
  }

  * {
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
    font-size: 10pt;
    color: #1C2833;
    background: #ffffff;
    margin: 0;
    padding: 0;
  }

  /* ── Report header ─────────────────────────────────────────────────────── */
  .report-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 3px solid #{{ primary_colour or '1A3C5E' }};
    margin-bottom: 12pt;
    padding-bottom: 8pt;
  }

  .report-header__logo img {
    max-height: 50px;
    max-width: 200px;
  }

  .report-header__logo-text {
    font-size: 14pt;
    font-weight: bold;
    color: #{{ primary_colour or '1A3C5E' }};
  }

  .report-header__meta {
    text-align: right;
    font-size: 9pt;
    color: #566573;
    line-height: 1.5;
  }

  /* ── Headings ──────────────────────────────────────────────────────────── */
  h1 {
    font-size: 16pt;
    color: #{{ primary_colour or '1A3C5E' }};
    margin: 0 0 12pt 0;
  }

  h2 {
    font-size: 12pt;
    color: #{{ primary_colour or '1A3C5E' }};
    border-bottom: 1px solid #ddd;
    padding-bottom: 3pt;
    margin: 14pt 0 6pt 0;
  }

  h3 {
    font-size: 10pt;
    color: #{{ secondary_colour or '2E86C1' }};
    margin: 10pt 0 4pt 0;
  }

  /* ── Tables ────────────────────────────────────────────────────────────── */
  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 12pt;
    font-size: 9pt;
  }

  th {
    background: #{{ primary_colour or '1A3C5E' }};
    color: #ffffff;
    padding: 5pt 6pt;
    text-align: left;
    font-size: 9pt;
    font-weight: bold;
  }

  td {
    padding: 4pt 6pt;
    font-size: 9pt;
    border-bottom: 1px solid #E5E7E9;
    vertical-align: top;
  }

  tr:nth-child(even) td {
    background: #F4F6F7;
  }

  /* ── Value styles ──────────────────────────────────────────────────────── */
  .na-value {
    color: #7F8C8D;
    font-style: italic;
  }

  .pos-val {
    color: #1E8449;
    font-weight: bold;
  }

  .neg-val {
    color: #C0392B;
    font-weight: bold;
  }

  .mono {
    font-family: 'Courier New', monospace;
  }

  /* ── Metric cards ──────────────────────────────────────────────────────── */
  .metric-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8pt;
    margin-bottom: 12pt;
  }

  .metric-card {
    border: 1px solid #E5E7E9;
    border-radius: 4pt;
    padding: 8pt;
    flex: 1;
    min-width: 100pt;
    background: #F8F9FA;
  }

  .metric-card__label {
    font-size: 8pt;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #566573;
    margin-bottom: 3pt;
  }

  .metric-card__value {
    font-size: 14pt;
    font-weight: bold;
    font-family: 'Courier New', monospace;
    color: #1C2833;
  }

  /* ── Status badges ─────────────────────────────────────────────────────── */
  .badge {
    display: inline-block;
    padding: 1pt 4pt;
    border-radius: 2pt;
    font-size: 8pt;
    font-weight: bold;
  }

  .badge--green  { background: #D5F5E3; color: #1E8449; }
  .badge--red    { background: #FADBD8; color: #C0392B; }
  .badge--yellow { background: #FEF9E7; color: #B7950B; }
  .badge--grey   { background: #F2F3F4; color: #566573; }

  /* ── Section separator ─────────────────────────────────────────────────── */
  .section-divider {
    border: none;
    border-top: 1px solid #E5E7E9;
    margin: 10pt 0;
  }

  /* ── Footer ────────────────────────────────────────────────────────────── */
  .report-footer {
    border-top: 1px solid #{{ primary_colour or '1A3C5E' }};
    margin-top: 16pt;
    padding-top: 6pt;
    font-size: 8pt;
    color: #566573;
  }
</style>
{% block page_override %}{% endblock %}
</head>
<body>

<!-- ── Report header ─────────────────────────────────────────────────────── -->
<div class="report-header">
  <div class="report-header__logo">
    {% if logo_url %}
      <img src="{{ logo_url }}" alt="{{ carrier_name }} logo">
    {% else %}
      <span class="report-header__logo-text">the Audit Platform</span>
    {% endif %}
  </div>
  <div class="report-header__meta">
    <div><strong>{{ carrier_name }}</strong></div>
    <div>Generated: {{ generated_at }}</div>
    <div>Tenant: {{ tenant_name }}</div>
  </div>
</div>

<!-- ── Page content ──────────────────────────────────────────────────────── -->
{% block content %}{% endblock %}

<!-- ── Contact / footer block ────────────────────────────────────────────── -->
{% if contact_block %}
<div class="report-footer">{{ contact_block | safe }}</div>
{% endif %}

</body>
</html>
